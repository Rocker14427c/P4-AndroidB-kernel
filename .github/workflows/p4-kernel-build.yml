# SPDX-License-Identifier: GPL-2.0
# Reproducible stock-equivalent kernel build for realme P4 5G (RMX5110, MT6878).
# Runs fully locally (no remote caches, no stored secrets). Both forks are
# public, so the vendor checkout needs no token. Release uploads use the
# ephemeral GITHUB_TOKEN that Actions provides; nothing is written to disk.
name: p4-kernel-build

on:
  push:
    branches: [p4/ci-build]
    paths:
      - '.github/workflows/p4-kernel-build.yml'
      - 'ci/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'user'
        type: choice
        options: [user, userdebug]
      release_tag:
        description: 'Optional release tag. Empty = build only, no GitHub Release.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  # Keep the large working set on the runner's big /mnt disk.
  ROOT: /mnt/buildroot
  STORE_DIR: /mnt/prebuilts-store
  VARIANT: ${{ github.event.inputs.variant || 'user' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /var/lib/docker
          df -h / /mnt

      - name: Add swap (8 GiB)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Prepare working directories on /mnt
        run: |
          sudo mkdir -p /mnt/buildroot /mnt/prebuilts-store
          sudo chown -R "$(id -u):$(id -g)" /mnt/buildroot /mnt/prebuilts-store
          df -h /mnt

      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          ref: p4/ci-build
          path: kernel-src
          fetch-depth: 1

      - name: Checkout vendor fork
        uses: actions/checkout@v4
        with:
          repository: Rocker14427c/P4-AndroidB-vendor-source
          ref: p4/ci-build
          path: vendor-src
          fetch-depth: 1

      - name: Fetch pinned prebuilts
        run: kernel-src/ci/fetch_prebuilts.sh

      - name: Assemble bazel workspace
        run: VENDOR_SRC="$PWD/vendor-src" kernel-src/ci/assemble_workspace.sh

      - name: Build kernel and vendor modules
        run: kernel-src/ci/build.sh

      - name: Package dist
        if: always()
        run: |
          mkdir -p uploads
          if [ -d "$ROOT/dist" ]; then
            tar -C "$ROOT" -czf uploads/p4-kernel-dist.tar.gz dist
          fi
          tar -C "$ROOT" -czf uploads/p4-build-logs.tar.gz logs || true
          ls -lh uploads/

      - name: Stage release assets
        if: ${{ env.RELEASE_TAG != '' }}
        run: |
          export KERNEL_SHA="${GITHUB_SHA}"
          export VENDOR_SHA="$(git -C vendor-src rev-parse HEAD)"
          export KERNEL_REF="p4/ci-build" VENDOR_REF="p4/ci-build"
          kernel-src/ci/package_release.sh
          # tagged copy of the full dist tarball for permanent release storage
          cp uploads/p4-kernel-dist.tar.gz \
             "uploads/release/p4-kernel-dist-${RELEASE_TAG}.tar.gz"

      - name: Create GitHub release and upload assets
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          # Explicit mapping: under set -u the implicitly injected token is
          # not guaranteed to be present in the step environment.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json")
          TAG="${RELEASE_TAG}"
          # Fetch existing release for this tag, or create one
          REL="$(curl -s "${AUTH[@]}" "${API}/releases/tags/${TAG}" || true)"
          if echo "${REL}" | python3 -c 'import json,sys; sys.exit(0 if "id" in json.load(sys.stdin) else 1)'; then
            REL_ID="$(echo "${REL}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            echo "Reusing existing release id ${REL_ID}"
          else
            BODY="Automated reproducible build (run ${GITHUB_RUN_NUMBER}).
          Kernel: ${GITHUB_SHA:0:12} (p4/ci-build). See BUILD-MANIFEST inside the images zip."
            REL="$(curl -s -X POST "${AUTH[@]}" "${API}/releases" \
              -d "$(python3 -c 'import json,os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": "p4/ci-build", "name": os.environ["TAG"], "body": os.environ["BODY"], "draft": False, "prerelease": False}))')")"
            REL_ID="$(echo "${REL}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            echo "Created release id ${REL_ID}"
          fi
          upload_asset() {
            local file="$1" ctype="$2" name old_id
            name="$(basename "${file}")"
            # Idempotent re-runs: replace an asset that already exists.
            old_id="$(curl -s "${AUTH[@]}" "${API}/releases/${REL_ID}/assets" \
              | NAME="${name}" python3 -c 'import json,sys,os; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"] == os.environ["NAME"]))')"
            for id in ${old_id}; do
              echo "Replacing existing asset ${name} (id ${id})"
              curl -s -X DELETE "${AUTH[@]}" "${API}/releases/assets/${id}" >/dev/null
            done
            echo "Uploading ${name} ($(du -h "${file}" | cut -f1))"
            curl -s -X POST "${AUTH[@]}" \
              -H "Content-Type: ${ctype}" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?name=${name}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ->", d.get("name"), d.get("state"), d.get("message",""))'
          }
          for f in uploads/release/*; do
            case "${f}" in
              *.zip)            upload_asset "${f}" application/zip ;;
              *.tar.gz)         upload_asset "${f}" application/gzip ;;
              *.sha256|*.txt)   upload_asset "${f}" text/plain ;;
              *)                upload_asset "${f}" application/octet-stream ;;
            esac
          done

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-kernel-${{ github.run_number }}
          path: uploads/
          retention-days: 30
          if-no-files-found: error
