# SPDX-License-Identifier: GPL-2.0
# Standalone publisher: turn an already-successful build's workflow artifact
# into a GitHub Release without rebuilding. Uses only the ephemeral
# GITHUB_TOKEN; no stored secrets.
name: p4-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update (e.g. rmx5110-6.1.134-r1)'
        required: true
        type: string
      source_run_id:
        description: 'Workflow run id whose artifact holds uploads/ (e.g. 40538420609)'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name in that run (e.g. p4-kernel-18)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout kernel fork (release scripts)
        uses: actions/checkout@v4
        with:
          ref: p4/ci-build
          path: kernel-src
          fetch-depth: 1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          path: uploads
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show staged files
        run: |
          find uploads -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: kernel-src/ci/publish_release.sh uploads/release
